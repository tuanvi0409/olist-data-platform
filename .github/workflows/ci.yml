name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q ingestion

      - name: Create CI dbt profile
        shell: bash
        run: |
          mkdir -p "$HOME/.dbt"
          printf '%s\n' \
            'olist_analytics:' \
            '  target: ci' \
            '  outputs:' \
            '    ci:' \
            '      type: postgres' \
            '      host: localhost' \
            '      port: 5432' \
            '      user: ci_user' \
            '      password: ci_password' \
            '      dbname: ci_db' \
            '      schema: analytics' \
            '      threads: 2' \
            > "$HOME/.dbt/profiles.yml"

      - name: Parse dbt project
        run: dbt parse --project-dir dbt/olist_analytics