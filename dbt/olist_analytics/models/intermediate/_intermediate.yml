version: 2

models:
  - name: int_payments_aggregated_to_orders
    description: Payment records aggregated to one row per order
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: total_payment_value
        data_tests:
          - not_null

  - name: int_order_items_aggregated_to_orders
    description: Order items aggregated to one row per order
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: total_item_value
        data_tests:
          - not_null

      - name: total_freight_value
        data_tests:
          - not_null

  - name: int_products_enriched
    description: Products enriched with English category names
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique


  - name: int_orders_enriched
    description: Orders enriched with item, payment and delivery metrics
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        data_tests:
          - not_null