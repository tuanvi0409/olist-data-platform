version: 2

models:
  - name: stg_customers
    description: Cleaned customer data
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        data_tests:
          - not_null

  - name: stg_orders
    description: Cleaned order data
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - created
                  - approved
                  - invoiced
                  - processing
                  - shipped
                  - delivered
                  - unavailable
                  - canceled

  - name: stg_products
    description: Cleaned product data
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: stg_sellers
    description: Cleaned seller data
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique

  - name: stg_order_items
    description: Cleaned order item data
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

  - name: stg_order_payments
    description: Cleaned payment data
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: payment_value
        data_tests:
          - not_null